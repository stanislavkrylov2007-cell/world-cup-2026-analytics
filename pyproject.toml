[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-2026-analytics"
version = "0.1.0"
description = "Portfolio analytics project about international football and World Cup 2026 preparation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Stanislav" }
]
dependencies = [
  "pandas>=2.2,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "jupyter>=1.1,<2.0",
  "matplotlib>=3.9,<4.0",
  "plotly>=5.24,<6.0",
  "seaborn>=0.13,<1.0",
  "scikit-learn>=1.5,<2.0",
  "streamlit>=1.37,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
]

[project.scripts]
wca-check-config = "world_cup_analytics.cli:check_config_command"
wca-validate-data = "world_cup_analytics.cli:validate_data_command"
wca-profile-data = "world_cup_analytics.cli:profile_data_command"
wca-transform-data = "world_cup_analytics.cli:transform_data_command"
wca-load-postgres = "world_cup_analytics.cli:load_postgres_command"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
